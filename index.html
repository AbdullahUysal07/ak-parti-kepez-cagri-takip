    async function decryptMembers(password){
      const encryptedMembers=await getEncryptedMembers();
      const enc = new TextEncoder();
      const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
      const keyMaterial = await crypto.subtle.deriveKey(
        {name:'PBKDF2', salt:b64bytes(encryptedMembers.salt), iterations:encryptedMembers.iterations, hash:'SHA-256'},
        baseKey,
        {name:'AES-GCM', length:256},
        false,
        ['decrypt']
      );
      const cipher = b64bytes(encryptedMembers.data);
      const tag = b64bytes(encryptedMembers.tag);
      const packed = new Uint8Array(cipher.length + tag.length);
      packed.set(cipher);
      packed.set(tag, cipher.length);
      const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64bytes(encryptedMembers.iv), tagLength:128}, keyMaterial, packed);
      if(encryptedMembers.compressed==='gzip'){

        const decompressed = await new Response(new Blob([plain]).stream().pipeThrough(stream)).arrayBuffer();
        return JSON.parse(new TextDecoder().decode(decompressed));
      }
      return JSON.parse(new TextDecoder().decode(plain));

    function streetName(address){const text=String(address||'').toLocaleUpperCase('tr-TR').replace(/[,\n]+/g,' ').replace(/\s+/g,' ').trim(); if(!text)return 'Adres bilgisi yok'; const parts=text.split(' '); for(let i=0;i<parts.length;i++){const token=parts[i].replace(/[.]/g,''); if(['SOK','SOKAK','SK','CAD','CADDE','CADDESİ','CD','BULVAR','BULVARI','BLV'].includes(token)){return (parts.slice(Math.max(0,i-3),i+1).join(' ')||token).replace(/\s+/g,' ');}} return text.split(' ').slice(0,5).join(' ');}
    function streetGroups(){const groups=new Map(); analysisList().forEach(m=>{const street=streetName(m.address); const key=(m.neighborhood||'Mahalle Yok')+'|'+street; if(!groups.has(key))groups.set(key,{key,neighborhood:m.neighborhood||'Mahalle Yok',street,members:[]}); groups.get(key).members.push(m);}); return Array.from(groups.values()).sort((a,b)=>b.members.length-a.members.length||a.street.localeCompare(b.street,'tr'));}
    function neighborhoodGroups(groups){const map=new Map(); groups.forEach(g=>{if(!map.has(g.neighborhood))map.set(g.neighborhood,{name:g.neighborhood,members:0,streets:0}); const h=map.get(g.neighborhood); h.members+=g.members.length; h.streets+=1;}); return Array.from(map.values()).sort((a,b)=>a.name.localeCompare(b.name,'tr'));}

    function renderAnalysis(){$('countText').textContent='Kepez Analiz'; $('memberList').innerHTML=''; startLocationPolling(); if(state.map){state.map.remove(); state.map=null; state.mapLayers=null;} const allAnalysis=analysisList(); const groups=streetGroups(); const hoods=neighborhoodGroups(groups); if(state.selectedAnalysisNeighborhood&&!hoods.some(h=>h.name===state.selectedAnalysisNeighborhood))state.selectedAnalysisNeighborhood=null; if(!state.selectedAnalysisNeighborhood)state.selectedStreet=null; const visibleGroups=state.selectedAnalysisNeighborhood?groups.filter(g=>g.neighborhood===state.selectedAnalysisNeighborhood):[]; const q=norm(state.analysisQuery||''); const filteredGroups=visibleGroups.filter(g=>!q||norm(`${g.neighborhood} ${g.street}`).includes(q)); if(state.selectedStreet&&!filteredGroups.some(g=>g.key===state.selectedStreet))state.selectedStreet=null; const selected=filteredGroups.find(g=>g.key===state.selectedStreet)||null; const active=canSeeLiveLocations()?state.locations.filter(l=>Date.now()-new Date(l.time).getTime()<1000*60*15):[]; const liveText=canSeeLiveLocations()?` • ${active.length} aktif konum`:''; const hoodOptions=`<option value="">Mahalle seçin</option>${hoods.map(h=>`<option value="${esc(h.name)}" ${state.selectedAnalysisNeighborhood===h.name?'selected':''}>${esc(h.name)} - ${h.members} üye</option>`).join('')}`; const streetOptions=state.selectedAnalysisNeighborhood?`<option value="">Sokak/cadde seçin</option>${filteredGroups.map(g=>`<option value="${esc(g.key)}" ${state.selectedStreet===g.key?'selected':''}>${esc(g.street)} - ${g.members.length} üye</option>`).join('')}`:'<option value="">Önce mahalle seçin</option>'; const selectionText=state.selectedAnalysisNeighborhood?`${filteredGroups.length} sokak/cadde bulundu.`:'Mahalle seçince sokak/cadde listesi açılır.'; $('detail').innerHTML=`<div class="analysis-shell"><aside class="analysis-sidebar"><div class="analysis-summary"><h2>Kepez Analiz</h2><div class="small">${hoods.leng     async function geocodeGroup(group){if(!group)return null; const cacheKey='geo:'+group.key; try{const cached=JSON.parse(localStorage.getItem(cacheKey)||'null'); if(cached&&cached.lat&&cached.lng)return cached;}catch(e){} const query=[group.street,group.neighborhood,'Kepez Antalya Türkiye'].filter(Boolean).join(' '); try{const url='https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates?f=json&maxLocations=1&SingleLine='+encodeURIComponent(query); const res=await fetch(url); const data=await res.json(); const c=data.candidates&&data.candidates[0]; if(c&&c.location){const point={lat:c.location.y,lng:c.location.x,label:c.address||query}; localStorage.setItem(cacheKey,JSON.stringify(point)); return point;}}catch(e){} return null;}
    async function geocodeMember(m, fallback, index){const cacheKey='geo-member:'+m.id; try{const cached=JSON.parse(localStorage.getItem(cacheKey)||'null'); if(cached&&cached.lat&&cached.lng)return cached;}catch(e){} const query=[m.address,m.neighborhood,'Kepez Antalya Türkiye'].filter(Boolean).join(' '); try{const url='https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates?f=json&maxLocations=1&SingleLine='+encodeURIComponent(query); const res=await fetch(url); const data=await res.json(); const c=data.candidates&&data.candidates[0]; if(c&&c.location){const point={lat:c.location.y,lng:c.location.x}; localStorage.setItem(cacheKey,JSON.stringify(point)); return point;}}catch(e){} if(!fallback)return null; const angle=index*.9; const radius=.00018+(index%8)*.000035; return {lat:fallback.lat+Math.sin(angle)*radius,lng:fallback.lng+Math.cos(angle)*radius};}
    async function drawMap(group){const el=$('kepezMap'); if(!el||!window.L)return; if(!state.map){state.map=L.map(el).setView([37.0219,30.7141],12); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(state.map); state.mapLayers=L.layerGroup().addTo(state.map);} else {state.map.invalidateSize(); state.mapLayers.clearLayers();} if(canSeeLiveLocations())state.locations.forEach(l=>{const age=Math.round((Date.now()-new Date(l.time).getTime())/60000); const marker=L.circleMarker([l.lat,l.lng],{radius:8,color:'#123c7c',fillColor:'#f28c00',fillOpacity:.9,className:'location-dot'}).addTo(state.mapLayers); marker.bindPopup(`<strong>${esc(l.name)}</strong><br>${esc(l.neighborhood||l.role||'')}<br>${age} dk önce`);}); const point=await geocodeGroup(group); if(group&&point){state.map.setView([point.lat,point.lng],17); const members=group.members.slice(0,80); const points=await Promise.all(members.map((m,i)=>geocodeMember(m,point,i))); points.forEach((p,i)=>{if(!p)return; const m=members[i]; const q=[m.address,m.neighborhood,'Kepez Antalya'].filter(Boolean).join(' '); const url='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q); const marker=L.circleMarker([p.lat,p.lng],{radius:7,color:'#fff',weight:2,fillColor:'#f28c00',fillOpacity:.95,className:'member-dot'}).addTo(state.mapLayers); marker.bindPopup(`<strong>${esc(m.name)}</strong><br>${esc(m.phone||'')}</br><span>${esc(m.address||'')}</span><br><a href="tel:${esc(m.phone)}">Ara</a> · <a href="${esc(url)}" target="_blank" rel="noopener">Konum Aç</a>`);}); if(group.members.length>80)toast('Haritada ilk 80 üye gösterildi. Liste altta devam ediyor.');} else {state.map.setView([37.0219,30.7141],12);}}
    async function postLocation(pos,auto=false){const last=Number(localStorage.getItem('uye-last-location-post')||0); if(auto&&Date.now()-last<1000*60*5)return; const a=userAccess(state.user); const body={username:state.user.username,name:a.name||state.user.name,role:a.role,neighborhood:(a.neighborhoods||[])[0]||'',lat:pos.coords.latitude,lng:pos.coords.longitude,accuracy:pos.coords.accuracy,time:new Date().toISOString()}; await fetch(PUSH_API_BASE+'/locations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); localStorage.setItem('uye-last-location-post',String(Date.now())); localStorage.setItem('uye-location-asked-v1','1'); if(!auto)toast('Konum paylaşıldı ve canlı takip açık.');}

    function renderAdmin(){const neighborhoodsList=Array.from(new Set(state.members.map(m=>m.neighborhood))).sort((a,b)=>a.localeCompare(b,'tr')); const called=state.logs.filter(l=>l.status==='called').length; const activeUsers=ACCESS_USERS.filter(u=>!isDisabledUser(u)).length; $('countText').textContent='Admin'; $('memberList').innerHTML=''; $('detail').innerHTML=`<div class="admin-shell"><div class="admin-section-head"><h2>Admin Panel</h2><button type="button" class="secondary" id="refreshAnnouncements">Yenile</button></div><div class="admin-grid"><div class="admin-card"><strong>Toplam log</strong><h2>${state.logs.length}</h2></div><div class="admin-card"><strong>Görüşülen</strong><h2>${called}</h2></div><div class="admin-card"><strong>Aktif kullanıcı</strong><h2>${activeUsers}</h2></div></div><section class="admin-section"><div class="admin-section-head"><h2>Ek Bildirim</h2><span class="small">Duyuru dışında anlık bildirim gönder</span></div><form id="pushForm" class="form"><div class="field"><label>Hedef kitle</label><select id="pushTarget"><option value="all">Herkes</option><option value="management">Ana kademe / yönetim</option><option value="neighborhood">Mahalle başkanları</option></select></div><div class="field"><label>Başlık</label><input id="pushTitle" value="AK Parti Kepez"></div><div class="field"><label>Mesaj</label><textarea id="pushBody" placeholder="Tüm cihazlara gidecek mesaj"></textarea></div><button>Bildirim Gönder</button></form></section><section class="admin-section"><div class="admin-section-head"><h2>Kullanıcı Düzenleme</h2><span class="small">Ad, kullanıcı adı, şifre ve yetki</span></div><div id="adminUsers"></div></section></div>`; $('adminUsers').innerHTML=ACCESS_USERS.map(u=>{const a=userAccess(u); const isMgmt=a.role==='management'; const disabled=!!a.disabled; return `<div class="user-row ${disabled?'disabled':''}" data-user="${esc(u.username)}"><input data-login-username value="${esc(a.loginUsername||u.username)}" placeholder="Kullanıcı adı"><input data-display-name value="${esc(a.name||u.name)}" placeholder="Ad soyad"><input data-password value="${esc(a.password||'kepez2026.')}" placeholder="Şifre"><select data-role><option value="management" ${isMgmt?'selected':''}>Yönetici</option><option value="neighborhood" ${!isMgmt?'selected':''}>Mahalle başkanı</option></select><select data-hood ${isMgmt?'disabled':''}>${neighborhoodsList.map(n=>`<option value="${esc(n)}" ${(a.neighborhoods||[])[0]===n?'selected':''}>${esc(n)}</option>`).join('')}</select><button type="button" data-save-user>Kaydet</button><button type="button" class="${disabled?'secondary':'danger'}" data-toggle-user>${disabled?'Geri Al':'Sil'}</button></div>`;}).join(''); $('pushForm').onsubmit=sendAdminPush; $('refreshAnnouncements').onclick=()=>loadAnnouncements(true); document.querySelectorAll('[data-save-user]').forEach(btn=>btn.onclick=e=>{const row=e.target.closest('[data-user]'); saveUserRow(row,false);}); document.querySelectorAll('[data-toggle-user]').forEach(btn=>btn.onclick=e=>{const row=e.target.closest('[data-user]'); saveUserRow(row,true);}); document.querySelectorAll('[data-role]').forEach(sel=>sel.onchange=e=>{const row=e.target.closest('[data-user]'); row.querySelector('[data-hood]').disabled=e.target.value==='management';});}
     async function updateRequest(id,status){const res=await fetch(PUSH_API_BASE+'/requests/'+encodeURIComponent(id),{method:'PUT',headers:{'Content-Type':'application/json','Authorization':'Bearer '+PUSH_ADMIN_TOKEN},body:JSON.stringify({status})}); if(!res.ok){toast('Talep güncellenemedi.'); return;} await loadRequests(); renderRequests();}
     function renderRequests(){const mine=state.requests.filter(r=>isAdmin()||r.username===state.user?.username); const form=`<form id="requestForm" class="form"><div class="field"><label>Talep veya öneriniz</label><textarea id="requestText" placeholder="Talep ve önerinizi yazın"></textarea></div><button>Gönder</button></form>`; const cards=mine.map(r=>`<article class="log"><div class="log-top"><strong>${esc(r.name||r.username)}</strong>${isAdmin()?`<select data-request-status="${esc(r.id)}"><option ${r.status==='new'?'selected':''} value="new">Yeni</option><option ${r.status==='reviewed'?'selected':''} value="reviewed">İnceleniyor</option><option ${r.status==='done'?'selected':''} value="done">Tamamlandı</option></select>`:`<span class="badge new">${esc(r.status)}</span>`}</div><span class="small">${esc(new Date(r.time).toLocaleString('tr-TR'))} • ${esc(r.neighborhood||'')}</span><p>${esc(r.text)}</p></article>`).join('')||'<div class="empty">Henüz talep veya öneri yok.</div>'; $('countText').textContent=isAdmin()?`${mine.length} talep`:'Talep ve Öneriler'; $('memberList').innerHTML=''; $('detail').innerHTML=`<div class="admin-shell"><div class="admin-section-head"><h2>Talep ve Öneriler</h2></div>${isAdmin()?'':form}<section class="admin-section">${cards}</section></div>`; const f=$('requestForm'); if(f)f.onsubmit=async e=>{e.preventDefault(); const text=$('requestText').value.trim(); if(!text)return; const a=userAccess(state.user); const res=await fetch(PUSH_API_BASE+'/requests',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,username:state.user.username,name:a.name||state.user.name,neighborhood:(a.neighborhoods||[])[0]||''})}); if(!res.ok){toast('Talep gönderilemedi.'); return;} $('requestText').value=''; await loadRequests(); renderRequests(); toast('Talebiniz iletildi.');}; document.querySelectorAll('[data-request-status]').forEach(s=>s.onchange=e=>updateRequest(e.target.dataset.requestStatus,e.target.value));}
    function canSeeAnnouncement(a){const role=state.user?userAccess(state.user).role:''; return !a.target||a.target==='all'||a.target===role;}
    async function loadAnnouncements(showToast=false){if(!PUSH_API_BASE)return; try{const role=state.user?userAccess(state.user).role:''; const res=await fetch(PUSH_API_BASE+'/announcements?username='+encodeURIComponent(state.user?state.user.username:'')+'&role='+encodeURIComponent(role),{cache:'no-store'}); const data=await res.json(); state.announcements=(Array.isArray(data.announcements)?data.announcements:[]).filter(canSeeAnnouncement); renderNotice(); if(showToast)toast('Duyurular yenilendi.'); if(state.mode==='home'||state.mode==='admin')render();}catch(e){if(showToast)toast('Duyurular alınamadı.');}}
    async function createAnnouncement(e){e.preventDefault(); if(!isAdmin())return; const input=$('homeAnnouncementInput')||$('announcementInput'); const target=($('homeAnnouncementTarget')||{value:'all'}).value; const body=input?input.value.trim():''; if(!body){toast('Duyuru metni gerekli.'); return;} const res=await fetch(PUSH_API_BASE+'/announcements',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+PUSH_ADMIN_TOKEN},body:JSON.stringify({body,target,authorName:'Hasan Demir',url:location.href})}); if(!res.ok){toast('Duyuru yayınlanamadı.'); return;} if(input)input.value=''; await loadAnnouncements(); toast('Duyuru yayınlandı ve hedef kitleye bildirim gönderildi.');}
    async function updateAnnouncement(id){const input=document.querySelector(`[data-announcement-body="${CSS.escape(id)}"]`); const body=input?input.value.trim():''; if(!body){toast('Duyuru metni boş olamaz.'); return;} const res=await fetch(PUSH_API_BASE+'/announcements/'+encodeURIComponent(id),{method:'PUT',headers:{'Content-Type':'application/json','Authorization':'Bearer '+PUSH_ADMIN_TOKEN},body:JSON.stringify({body})}); if(!res.ok){toast('Duyuru düzenlenemedi.'); return;} await loadAnnouncements(); toast('Duyuru güncellendi.');}
    async function deleteAnnouncement(id){const res=await fetch(PUSH_API_BASE+'/announcements/'+encodeURIComponent(id),{method:'DELETE',headers:{'Authorization':'Bearer '+PUSH_ADMIN_TOKEN}}); if(!res.ok){toast('Duyuru silinemedi.'); return;} await loadAnnouncements(); toast('Duyuru silindi.');}
    async function saveUserRow(row,toggleDisabled){if(!row)return; const role=row.querySelector('[data-role]').value; const hood=row.querySelector('[data-hood]').value; const loginUsername=normalizeUser(row.querySelector('[data-login-username]').value)||row.dataset.user; const name=row.querySelector('[data-display-name]').value.trim(); const password=row.querySelector('[data-password]').value.trim()||'kepez2026.'; const prev=state.accessOverrides[row.dataset.user]||{}; const disabled=toggleDisabled?!prev.disabled:!!prev.disabled; const payload={username:row.dataset.user,loginUsername,name,password,role,neighborhood:hood,disabled}; state.accessOverrides[row.dataset.user]={loginUsername,name,password,role,neighborhoods:role==='management'?[]:[hood],disabled}; save(); try{const res=await fetch(PUSH_API_BASE+'/access',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+PUSH_ADMIN_TOKEN},body:JSON.stringify(payload)}); if(!res.ok)throw new Error('save_failed'); const data=await res.json(); if(data.overrides)state.accessOverrides=data.overrides; save(); fillNeighborhoods(); render(); toast(disabled?'Kullanıcı silindi/pasifleştirildi.':'Kullanıcı kaydedildi.');}catch(e){toast('Kullanıcı kaydedilemedi.');}}
    function handleAdminClick(e){const update=e.target.closest('[data-update-announcement]'); if(update){updateAnnouncement(update.dataset.updateAnnouncement); return true;} const delAnn=e.target.closest('[data-delete-announcement]'); if(delAnn){deleteAnnouncement(delAnn.dataset.deleteAnnouncement); return true;} const saveUser=e.target.closest('[data-save-user]'); if(saveUser){saveUserRow(saveUser.closest('[data-user]'),false); return true;} const toggleUser=e.target.closest('[data-toggle-user]'); if(toggleUser){saveUserRow(toggleUser.closest('[data-user]'),true); return true;} return false;}
    async function markAnnouncementsRead(){if(!state.user||!state.announcements.length)return; const latest=state.announcements[0]; if(state.lastSeenAnnouncement===latest.id)return; state.lastSeenAnnouncement=latest.id; save(); try{await fetch(PUSH_API_BASE+'/announcements/read',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:state.user.username,name:state.user.name,announcementId:latest.id})}); await loadAnnouncements();}catch(e){}}
    async function toggleAnnouncementLike(id){if(!state.user)return; try{await fetch(PUSH_API_BASE+'/announcements/like',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:state.user.username,name:state.user.name,announcementId:id})}); await loadAnnouncements(); toast('Beğeni kaydedildi.');}catch(e){toast('Beğeni kaydedilemedi.');}}
    function queuedLogs(){try{return JSON.parse(localStorage.getItem('pending-call-logs')||'[]');}catch(e){return [];}}
    function setQueuedLogs(items){localStorage.setItem('pending-call-logs',JSON.stringify(items.slice(0,200)));}
    async function flushQueuedLogs(){if(!PUSH_API_BASE)return; const queue=queuedLogs(); if(!queue.length)return; const remaining=[]; for(const item of queue){try{const res=await fetch(PUSH_API_BASE+'/logs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(item)}); if(!res.ok)remaining.push(item);}catch(e){remaining.push(item);}} setQueuedLogs(remaining);}
    async function addLog(status,note,agent,advance=false){if(!state.selected)return; const m=selectedMember()||{}; const item={id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),memberId:state.selected,memberName:m.name||'',memberPhone:m.phone||'',neighborhood:m.neighborhood||'',status,note:(note||'').trim(),agent:(agent||state.user?.name||'').trim(),username:state.user?state.user.username:'',time:new Date().toISOString()}; state.logs=state.logs.filter(l=>l.id!==item.id); state.logs.unshift(item); save(); let saved=false; try{const res=await fetch(PUSH_API_BASE+'/logs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(item)}); saved=res.ok;}catch(e){} if(!saved){const queue=queuedLogs().filter(l=>l.id!==item.id); queue.unshift(item); setQueuedLogs(queue); toast('Log cihazda kaydedildi, internet gelince tekrar gönderilecek.');} else {toast('Log kaydedildi.');} if(advance){selectNext(); return;} render();}
    function toast(msg){const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast.timer); toast.timer=setTimeout(()=>t.classList.remove('show'),2200);}
     async function finishLogin(user,password,remember){load(); void loadAccessOverrides(); const access=userAccess(user); if(isDisabledUser(user)||password!==access.password){state.user=null; throw new Error('login_failed');} if(remember)localStorage.setItem(loginKey,JSON.stringify({username:access.loginUsername||user.username,password})); else localStorage.removeItem(loginKey); state.user={...user,...access,username:user.username}; state.members=await decryptMembers('kepez2026.'); sessionStorage.setItem(authKey,user.username); document.body.classList.remove('locked'); $('adminNavBtn').hidden=!isAdmin(); $('analysisNavBtn').hidden=!canUseAnalysis(); $('logsNavBtn').hidden=!isAdmin(); $('exportBtn').hidden=!isAdmin(); fillNeighborhoods(); setMode(state.mode); void Promise.allSettled([flushQueuedLogs(),loadAnnouncements(),loadLogs(),loadLocations()]).then(()=>{if(state.user){renderNotice(); if(state.mode==='home'||state.mode==='admin')render();}});}
     function logout(){localStorage.removeItem(loginKey); sessionStorage.removeItem(authKey); if(state.locationWatch!==null&&navigator.geolocation)navigator.geolocation.clearWatch(state.locationWatch); state.locationWatch=null; state.members=[]; state.user=null; state.selected=null; document.body.classList.add('locked'); $('drawer').classList.remove('open'); $('drawer').setAttribute('aria-hidden','true'); $('usernameInput').value=''; $('passwordInput').value=''; $('loginError').textContent=''; $('adminNavBtn').hidden=true; $('analysisNavBtn').hidden=true; $('logsNavBtn').hidden=true; $('exportBtn').hidden=true; $('detail').innerHTML='<div class="empty">Giriş yapınca üyeler açılacak.</div>'; $('memberList').innerHTML='<div class="empty">Üye listesi şifreli.</div>'; $('logs').innerHTML='<div class="empty">Loglar girişten sonra görünür.</div>';}
    async function tryAutoLogin(){try{const saved=JSON.parse(localStorage.getItem(loginKey)||'null'); if(!saved||!saved.username||!saved.password)return; load(); const wanted=normalizeUser(saved.username); const user=ACCESS_USERS.find(u=>normalizeUser(userAccess(u).loginUsername||u.username)===wanted); if(!user)return; $('loginError').textContent='Oturum açılıyor...'; await finishLogin(user,saved.password,true); $('loginError').textContent='';}catch(e){if(e&&e.message==='login_failed'){localStorage.removeItem(loginKey); $('loginError').textContent='Kayıtlı giriş bilgileri geçersiz. Lütfen bir kez giriş yapın.';}else{$('loginError').textContent='Bağlantı bekleniyor; kayıtlı giriş korunuyor.';}}}
    function urlBase64ToUint8Array(value){const padded=value+'='.repeat((4-value.length%4)%4); const raw=atob(padded.replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from(raw,c=>c.charCodeAt(0));}
    async function enablePush(){if(!PUSH_API_BASE){toast('Cloudflare bildirim servisi henüz bağlanmadı.'); return;} if(!('serviceWorker' in navigator)||!('PushManager' in window)){toast('Bu cihaz bildirim desteklemiyor.'); return;} const permission=await Notification.requestPermission(); if(permission!=='granted'){toast('Bildirim izni verilmedi.'); return;} const registration=await navigator.serviceWorker.register('./sw.js'); const existing=await registration.pushManager.getSubscription(); const subscription=existing||await registration.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(PUSH_PUBLIC_KEY)}); const role=state.user?userAccess(state.user).role:''; await fetch(PUSH_API_BASE+'/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:state.user?state.user.username:'',role,subscription})}); toast('Bildirimler açıldı.');}
    async function sendAdminPush(e){e.preventDefault(); if(!isAdmin()){toast('Bu işlem sadece admin içindir.'); return;} if(!PUSH_API_BASE){toast('Önce Cloudflare Worker URL bağlanmalı.'); return;} const body=$('pushBody').value.trim(); if(!body){toast('Mesaj gerekli.'); return;} const target=($('pushTarget')||{value:'all'}).value; const res=await fetch(PUSH_API_BASE+'/send',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+PUSH_ADMIN_TOKEN},body:JSON.stringify({title:$('pushTitle').value.trim()||'AK Parti Kepez',body,target,url:location.href})}); const data=await res.json().catch(()=>({})); if(!res.ok){toast('Bildirim gönderilemedi.'); return;} toast(`Bildirim gönderildi: ${data.sent||0} cihaz`);}
    async function refreshApp(){if(!state.user)return; await flushQueuedLogs(); await loadAnnouncements(); await loadLogs(); await loadLocations(); fillNeighborhoods(); render(); toast('Sayfa yenilendi.');}
    function scrollDetailIntoView(){if(!window.matchMedia('(max-width:1050px)').matches)return; const panel=$('detail').closest('.panel'); if(panel) setTimeout(()=>panel.scrollIntoView({behavior:'smooth',block:'start'}),60);}
    function setupPullRefresh(){let startY=0,tracking=false,ready=false; const indicator=$('pullRefresh'); window.addEventListener('touchstart',e=>{if(window.scrollY>0||document.body.classList.contains('locked'))return; startY=e.touches[0].clientY; tracking=true; ready=false;},{passive:true}); window.addEventListener('touchmove',e=>{if(!tracking)return; const diff=e.touches[0].clientY-startY; if(diff>70){ready=true; indicator.classList.add('show');} else if(diff<20){ready=false; indicator.classList.remove('show');}},{passive:true}); window.addEventListener('touchend',()=>{if(!tracking)return; tracking=false; indicator.classList.remove('show'); if(ready)refreshApp();},{passive:true});}

    $('exportBtn').onclick=async()=>{if(!isAdmin()){toast('Log kayıtlarını sadece Hasan Demir indirebilir.'); return;} await loadLogs(); const rows=[['Tarih','Üye','Telefon','Mahalle','Durum','Not','Arayan','Kullanıcı']].concat(state.logs.map(l=>{const m=state.members.find(x=>x.id===l.memberId)||{name:l.memberName||'',phone:l.memberPhone||'',neighborhood:l.neighborhood||''}; return [new Date(l.time).toLocaleString('tr-TR'),m.name||'',m.phone||'',m.neighborhood||'',statusLabels[l.status]||l.status,l.note||'',l.agent||'',l.username||''];})); const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\n'); const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='arama-loglari.csv'; a.click(); URL.revokeObjectURL(a.href);};
    $('loginForm').onsubmit=async e=>{e.preventDefault(); $('loginError').textContent='Kontrol ediliyor...'; load(); const wanted=normalizeUser($('usernameInput').value); const user=ACCESS_USERS.find(u=>normalizeUser(userAccess(u).loginUsername||u.username)===wanted); if(!user){$('loginError').textContent='Kullanıcı bulunamadı.'; return;} try{await finishLogin(user,$('passwordInput').value,$('rememberInput').checked); $('passwordInput').value=''; $('loginError').textContent='';} catch(err){$('loginError').textContent='Şifre hatalı veya kullanıcı pasif.';}};
